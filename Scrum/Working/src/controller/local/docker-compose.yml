# Bases de datos para desarrollo local (Postgres + Neo4j con APOC).
# Uso: docker compose -f local/docker-compose.yml up -d   (desde src/controller)
services:
  postgres:
    image: postgres:16.3
    container_name: contratogt_postgres
    environment:
      POSTGRES_DB: contratogt
      POSTGRES_USER: contratogt
      POSTGRES_PASSWORD: contratogt_local
    ports:
      - "5433:5432"
    volumes:
      - ./init:/docker-entrypoint-initdb.d:ro
      - pgdata:/var/lib/postgresql/data

  neo4j:
    image: neo4j:5
    container_name: contratogt_neo4j
    environment:
      NEO4J_AUTH: neo4j/contratogt_local
      NEO4J_PLUGINS: '["apoc"]'
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4jdata:/data

volumes:
  pgdata:
  neo4jdata:
